services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ${OMSONS_ENV_FILE:-./.env}
    environment:
      PORT: 4000
      NODE_ENV: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
