services:
  postgres:
    image: postgres:16-alpine
    container_name: omsons-crm-postgres
    environment:
      POSTGRES_USER: omsons
      POSTGRES_PASSWORD: omsons_password
      POSTGRES_DB: omsons_crm
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omsons-crm-redis
    ports:
      - '6380:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
